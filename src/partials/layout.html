<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{desc}}">
  <script>
    // Apply the saved theme before first paint so there's no flash.
    try { var t = localStorage.getItem('wds-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/wds.css">
  <link rel="stylesheet" href="/css/docs.css">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body class="layout-{{layout}}">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn menu-btn" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
      <svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="/index.html">
      <svg class="brand-mark" aria-hidden="true" viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M8 11h16M16 11v12" /></svg>
      <span>WDS <b>3.0</b></span>
    </a>
    <nav class="topnav" aria-label="Main">
      <a href="/foundations/colour.html">Foundations</a>
      <a href="/components/button.html">Components</a>
      <a href="/sections/hero.html">Sections</a>
      <a href="/content/character-limits.html">Content</a>
      <a href="/developers/getting-started.html">Developers</a>
    </nav>
    <div class="topbar-actions">
      <button class="search-btn" type="button" data-search-open aria-label="Search the docs">
        <svg class="i" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="search-btn-label">Search</span><kbd>/</kbd>
      </button>
      <div class="theme-switch" role="group" aria-label="Colour theme">
        <button type="button" data-theme-set="light" aria-pressed="false" title="Light theme"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="visually-hidden">Light</span></button>
        <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark theme"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="visually-hidden">Dark</span></button>
        <button type="button" data-theme-set="system" aria-pressed="true" title="Match system"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="visually-hidden">System</span></button>
      </div>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Documentation">
      <nav>{{sidebar}}</nav>
    </aside>
    <div class="scrim" data-sidebar-close hidden></div>

    <main id="main" class="main" tabindex="-1">
      <article class="doc">
        {{header}}
        <div class="doc-body">
          {{content}}
        </div>
      </article>
      {{toc}}
    </main>
  </div>

  <footer class="site-footer">
    <p>WDS 3.0 · Tekion Website Design System. Design source: <a href="https://www.figma.com/design/lf5SOxUpWBtO8AIzXf6snw/WDS-3.0" target="_blank" rel="noopener">Figma<span class="visually-hidden"> (opens in a new tab)</span></a>.</p>
  </footer>

  <dialog class="search-dialog" aria-label="Search">
    <form method="dialog" class="search-form" role="search">
      <svg class="i" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Search pages and sections" aria-label="Search pages and sections" autocomplete="off" aria-controls="search-results">
      <kbd>Esc</kbd>
    </form>
    <ul id="search-results" class="search-results" role="listbox" aria-label="Results"></ul>
  </dialog>

  <script src="/js/wds.js" defer></script>
  <script src="/js/docs.js" defer></script>
</body>
</html>
