<!--meta {"layout": "bare"} -->
<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype lab · WDS 3.0</title>
  <meta name="description" content="Build page prototypes from WDS 3.0 sections, tokens and components.">
  <script>
    // Same saved theme as the docs, applied before first paint
    try { var t = localStorage.getItem('wds-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/lab.css">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <script src="/js/lab-import.js" defer></script>
  <script src="/js/lab.js" defer></script>
</head>
<body class="lab">
  <header class="lab-top">
    <a class="lab-brand" href="/index.html" title="Back to the WDS 3.0 docs">
      <svg class="lab-mark" aria-hidden="true" viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M8 11h16M16 11v12"/></svg>
      <span>WDS <b>3.0</b></span><span class="lab-brand-sub">Prototype lab</span>
    </a>
    <button class="lab-btn lab-only-narrow" type="button" data-panel="library" aria-expanded="false" aria-controls="lab-library">Library</button>
    <button class="lab-btn" type="button" id="lab-import" title="Build a page from a Word brief (.docx)"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 18v-6M9 15l3 3 3-3"/></svg><span class="lab-btn-label">Import .docx</span></button>
    <input id="lab-file" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    <label class="lab-preset"><span class="visually-hidden">Start from</span>
      <select id="lab-preset" aria-label="Start from a preset"></select>
    </label>
    <div class="lab-seg" role="group" aria-label="Viewport">
      <button type="button" data-vp="desktop" aria-pressed="true" title="Desktop, 1440px"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="lab-seg-label">Desktop</span></button>
      <button type="button" data-vp="tablet" aria-pressed="false" title="Tablet, 768px"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg><span class="lab-seg-label">Tablet</span></button>
      <button type="button" data-vp="mobile" aria-pressed="false" title="Mobile, 390px"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg><span class="lab-seg-label">Mobile</span></button>
    </div>
    <div class="lab-seg" role="group" aria-label="Page theme">
      <button type="button" data-pt="light" aria-pressed="true" title="Light page"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="visually-hidden">Light</span></button>
      <button type="button" data-pt="dark" aria-pressed="false" title="Dark page"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="visually-hidden">Dark</span></button>
    </div>
    <button class="lab-btn" type="button" id="lab-edit" aria-pressed="false" title="Edit the text on the canvas (E)"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg><span class="lab-btn-label">Edit text</span></button>
    <div class="lab-top-actions">
      <button class="lab-icon" type="button" id="lab-undo" title="Undo (⌘Z)" aria-label="Undo" disabled><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="lab-icon" type="button" id="lab-redo" title="Redo (⇧⌘Z)" aria-label="Redo" disabled><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="lab-btn" type="button" id="lab-open" title="Open the page in a new tab"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></svg><span class="lab-btn-label">Preview</span></button>
      <button class="lab-btn" type="button" id="lab-copy" title="Copy the page HTML"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span class="lab-btn-label">Copy HTML</span></button>
      <button class="lab-btn lab-btn--primary" type="button" id="lab-export"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Export</button>
    </div>
    <button class="lab-btn lab-only-narrow" type="button" data-panel="layers" aria-expanded="false" aria-controls="lab-layers">Layers</button>
  </header>

  <div class="lab-body">
    <aside class="lab-panel lab-panel--left" id="lab-library" aria-label="Library">
      <div class="lab-tabs" role="tablist" aria-label="Library">
        <button type="button" role="tab" id="tab-sections" aria-controls="pane-sections" aria-selected="true">Sections</button>
        <button type="button" role="tab" id="tab-foundations" aria-controls="pane-foundations" aria-selected="false" tabindex="-1">Foundations</button>
      </div>
      <div class="lab-search">
        <svg class="i" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="lab-filter" type="search" placeholder="Filter sections" aria-label="Filter the library" autocomplete="off">
      </div>
      <div class="lab-pane" id="pane-sections" role="tabpanel" aria-labelledby="tab-sections" tabindex="0"></div>
      <div class="lab-pane" id="pane-foundations" role="tabpanel" aria-labelledby="tab-foundations" tabindex="0" hidden></div>
    </aside>

    <main class="lab-stage" id="lab-stage" aria-label="Canvas">
      <div class="lab-device" id="lab-device">
        <iframe id="lab-frame" title="Page prototype canvas"></iframe>
      </div>
      <p class="lab-size" id="lab-size" aria-live="polite"></p>
    </main>

    <aside class="lab-panel lab-panel--right" id="lab-layers" aria-label="Page">
      <div class="lab-panel-head">
        <h2>Page</h2>
        <span class="lab-count" id="lab-count"></span>
      </div>
      <ol class="lab-layers" id="lab-list" aria-label="Sections on the page"></ol>
      <section class="lab-inspector" id="lab-inspector" aria-labelledby="lab-insp-title" hidden>
        <h2 id="lab-insp-title">Section</h2>
        <p class="lab-insp-name" id="lab-insp-name"></p>
        <fieldset class="lab-field">
          <legend>Theme</legend>
          <div class="lab-seg lab-seg--full" id="lab-insp-theme">
            <button type="button" data-bt="default" aria-pressed="true">Default</button>
            <button type="button" data-bt="page" aria-pressed="false">Page</button>
            <button type="button" data-bt="light" aria-pressed="false">Light</button>
            <button type="button" data-bt="dark" aria-pressed="false">Dark</button>
          </div>
          <p class="lab-hint" id="lab-insp-hint"></p>
        </fieldset>
        <button class="lab-btn" type="button" id="lab-insp-add" hidden>Add question</button>
        <div class="lab-insp-actions">
          <button class="lab-btn" type="button" id="lab-insp-reset">Reset content</button>
          <a class="lab-btn" id="lab-insp-docs" href="/index.html" target="_blank" rel="noopener">Guidelines<span class="visually-hidden"> (opens in a new tab)</span></a>
        </div>
      </section>
      <p class="lab-keys">Drag sections to reorder. <kbd>E</kbd> edit text · <kbd>⌫</kbd> remove · <kbd>⌘D</kbd> duplicate · <kbd>⌥↑</kbd><kbd>⌥↓</kbd> move</p>
    </aside>
  </div>

  <dialog class="lab-report" id="lab-report" aria-labelledby="lab-report-title">
    <div class="lab-report-head">
      <h2 id="lab-report-title">Imported page</h2>
      <button class="lab-icon" type="button" data-close aria-label="Close"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="lab-report-body" id="lab-report-body"></div>
    <div class="lab-report-foot">
      <button class="lab-btn" type="button" id="lab-report-undo">Undo import</button>
      <button class="lab-btn lab-btn--primary" type="button" data-close>Review the page</button>
    </div>
  </dialog>

  <p class="lab-toast" id="lab-toast" role="status" aria-live="polite"></p>
</body>
</html>
