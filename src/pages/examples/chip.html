<!--meta {"layout": "example", "title": "Chip", "css": ".row{display:flex;flex-wrap:wrap;gap:24px 32px;align-items:center;width:100%}.cell{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:120px}.cell>span{font-size:12px;color:var(--wds-text-tertiary)}.group{font-weight:600;color:var(--wds-text-primary);margin-top:16px}"} -->
<div class="demo demo-col">
<p class="demo-label group">States</p>
<div class="row"><div class="cell"><button class="wds-chip" type="button" aria-pressed="false">Chip</button><span>Default</span></div><div class="cell"><button class="wds-chip is-hover" type="button" aria-pressed="false">Chip</button><span>Hover</span></div><div class="cell"><button class="wds-chip is-pressed" type="button" aria-pressed="false">Chip</button><span>Pressed</span></div><div class="cell"><button class="wds-chip" type="button" aria-pressed="true">Chip</button><span>Selected</span></div><div class="cell"><button class="wds-chip" type="button" aria-pressed="false" aria-disabled="true">Chip</button><span>Disabled</span></div><div class="cell"><button class="wds-chip is-focus" type="button" aria-pressed="false">Chip</button><span>Focus</span></div></div>
<p class="demo-label group">Single choice: pick a day</p>
<fieldset class="row" style="border:0;margin:0;padding:0"><legend class="visually-hidden">Day</legend><ul class="wds-chips"><li><label><input class="wds-chip__input" type="radio" name="day" checked><span class="wds-chip">Tue, Feb 17</span></label></li><li><label><input class="wds-chip__input" type="radio" name="day"><span class="wds-chip">Wed, Feb 18</span></label></li><li><label><input class="wds-chip__input" type="radio" name="day"><span class="wds-chip">Thu, Feb 19</span></label></li><li><label><input class="wds-chip__input" type="radio" name="day"><span class="wds-chip">Fri, Feb 20</span></label></li></ul></fieldset>
<p class="demo-label group">Filters: pick any</p>
<div class="row" role="group" aria-label="Filter sessions"><ul class="wds-chips"><li><button class="wds-chip" type="button" aria-pressed="true">Sales</button></li><li><button class="wds-chip" type="button" aria-pressed="false">Service</button></li><li><button class="wds-chip" type="button" aria-pressed="false">Accounting</button></li><li><button class="wds-chip" type="button" aria-pressed="false">Parts</button></li></ul></div>
</div>
<script>document.querySelectorAll('[aria-label="Filter sessions"] .wds-chip').forEach((c) => c.addEventListener('click', () => c.setAttribute('aria-pressed', String(c.getAttribute('aria-pressed') !== 'true'))));</script>
